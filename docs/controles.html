<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><title>Controles · Apaga el fuego VR</title>
<style>
  html,body{margin:0;background:#14181d}
  svg{display:block;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif}
  .t{fill:#f4efe4}.m{fill:#a9b0b8}.y{fill:#f2c500}
  .ld{stroke:#f2c500;stroke-width:2.5;fill:none}
  .dot{fill:#f2c500}
</style></head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- control genérico visto desde arriba (lado izquierdo); el derecho se dibuja espejado -->
    <g id="ctrl">
      <path d="M-34 40 Q-40 120 -26 166 Q0 182 26 166 Q40 120 34 40 Z" fill="#23272d" stroke="#3a414a" stroke-width="3"/>
      <ellipse cx="-58" cy="-58" rx="92" ry="80" fill="none" stroke="#3a414a" stroke-width="16"/>
      <ellipse cx="0" cy="0" rx="74" ry="66" fill="#2b3139" stroke="#454d57" stroke-width="3"/>
      <rect x="-22" y="44" width="44" height="34" rx="12" fill="#f2c500" opacity=".85"/>
      <rect x="22" y="92" width="22" height="56" rx="10" fill="#4cc582" opacity=".9"/>
      <circle cx="-20" cy="-8" r="24" fill="#3c434c"/><circle cx="-20" cy="-8" r="15" fill="#1c2026"/>
      <circle cx="30" cy="16" r="15" fill="#4a535e"/><circle cx="24" cy="-28" r="15" fill="#4a535e"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#14181d"/>
  <!-- título -->
  <text x="60" y="78" class="y" font-size="46" font-weight="900">Apaga el fuego · VR</text>
  <text x="62" y="116" class="m" font-size="24">Manual de controles para Meta Quest (u otro visor con WebXR)</text>
  <rect x="1180" y="48" width="360" height="66" rx="14" fill="#262c33" stroke="#3a414a"/>
  <text x="1360" y="78" class="m" font-size="17" text-anchor="middle">Abre en el navegador del visor:</text>
  <text x="1360" y="102" class="t" font-size="17" font-weight="700" text-anchor="middle">…/cl-extintor-curso/vr.html → Entrar en VR</text>

  <!-- ===== MANO IZQUIERDA ===== -->
  <rect x="40" y="150" width="740" height="470" rx="22" fill="#1c2127" stroke="#2e353d"/>
  <text x="70" y="196" class="t" font-size="30" font-weight="800">Mano izquierda</text>
  <text x="70" y="226" class="m" font-size="20">Sostiene el extintor (manómetro y etiqueta a la vista)</text>
  <g transform="translate(250 380)"><use href="#ctrl"/>
    <text x="30" y="22" font-size="15" font-weight="800" fill="#f4efe4" text-anchor="middle">X</text>
    <text x="24" y="-22" font-size="15" font-weight="800" fill="#f4efe4" text-anchor="middle">Y</text>
  </g>
  <!-- etiquetas izquierda -->
  <g>
    <circle class="dot" cx="290" cy="347" r="5"/><path class="ld" d="M290 347 L420 296"/>
    <text x="430" y="304" class="t" font-size="23" font-weight="800">Y</text><text x="462" y="304" class="m" font-size="20">volver al menú</text>
    <circle class="dot" cx="230" cy="372" r="5"/><path class="ld" d="M230 372 L420 344"/>
    <text x="430" y="352" class="t" font-size="23" font-weight="800">Stick</text><text x="500" y="352" class="m" font-size="20">caminar</text>
    <circle class="dot" cx="296" cy="398" r="5"/><path class="ld" d="M296 398 L420 394"/>
    <text x="430" y="402" class="t" font-size="23" font-weight="800">X</text><text x="462" y="402" class="m" font-size="20">sacar el pasador</text>
    <circle class="dot" cx="250" cy="441" r="5"/><path class="ld" d="M250 441 L420 446"/>
    <text x="430" y="452" class="y" font-size="23" font-weight="800">Gatillo</text><text x="430" y="478" class="m" font-size="20">apretar la palanca (descargar)</text>
    <circle class="dot" cx="283" cy="500" r="5"/><path class="ld" d="M283 500 L420 522" style="stroke:#4cc582"/>
    <text x="430" y="530" font-size="23" font-weight="800" fill="#4cc582">Grip</text><text x="430" y="556" class="m" font-size="20">sin uso (solo sostener)</text>
  </g>

  <!-- ===== MANO DERECHA ===== -->
  <rect x="820" y="150" width="740" height="470" rx="22" fill="#1c2127" stroke="#2e353d"/>
  <text x="850" y="196" class="t" font-size="30" font-weight="800">Mano derecha</text>
  <text x="850" y="226" class="m" font-size="20">Es la boquilla: apunta con el control</text>
  <g transform="translate(1340 380) scale(-1 1)"><use href="#ctrl"/></g>
  <g transform="translate(1340 380)">
    <text x="-30" y="22" font-size="15" font-weight="800" fill="#f4efe4" text-anchor="middle">A</text>
    <text x="-24" y="-22" font-size="15" font-weight="800" fill="#f4efe4" text-anchor="middle">B</text>
  </g>
  <g>
    <circle class="dot" cx="1300" cy="347" r="5"/><path class="ld" d="M1300 347 L1170 296"/>
    <text x="1160" y="304" class="m" font-size="20" text-anchor="end">volver al menú</text><text x="1006" y="304" class="t" font-size="23" font-weight="800" text-anchor="end">B</text>
    <circle class="dot" cx="1360" cy="372" r="5"/><path class="ld" d="M1360 372 L1170 344"/>
    <text x="1160" y="352" class="m" font-size="20" text-anchor="end">girar 30° (izq. / der.)</text><text x="960" y="352" class="t" font-size="23" font-weight="800" text-anchor="end">Stick</text>
    <circle class="dot" cx="1294" cy="398" r="5"/><path class="ld" d="M1294 398 L1170 394"/>
    <text x="1160" y="402" class="m" font-size="20" text-anchor="end">sacar el pasador</text><text x="994" y="402" class="t" font-size="23" font-weight="800" text-anchor="end">A</text>
    <circle class="dot" cx="1340" cy="441" r="5"/><path class="ld" d="M1340 441 L1170 446"/>
    <text x="1160" y="452" class="y" font-size="23" font-weight="800" text-anchor="end">Gatillo</text><text x="1160" y="478" class="m" font-size="20" text-anchor="end">descargar · en menús: elegir</text>
    <circle class="dot" cx="1307" cy="500" r="5"/><path class="ld" d="M1307 500 L1170 522" style="stroke:#4cc582"/>
    <text x="1160" y="530" font-size="23" font-weight="800" fill="#4cc582" text-anchor="end">Grip</text><text x="1160" y="556" class="m" font-size="20" text-anchor="end">junto al anillo amarillo: sacar pasador</text>
  </g>
  <text x="1190" y="600" class="m" font-size="17" text-anchor="middle">En los menús, apunta con cualquier mano y aprieta el gatillo.</text>
  <text x="410" y="600" class="m" font-size="17" text-anchor="middle">También puedes caminar de verdad dentro de tu zona segura.</text>

  <!-- ===== PASOS ===== -->
  <text x="60" y="676" class="t" font-size="28" font-weight="800">La técnica en 4 pasos</text>
  <g font-size="20">
    <g transform="translate(40 696)">
      <rect width="368" height="128" rx="16" fill="#1c2127" stroke="#2e353d"/>
      <circle cx="40" cy="40" r="22" class="dot"/><text x="40" y="48" text-anchor="middle" font-weight="900" font-size="22" fill="#1b1a10">1</text>
      <text x="76" y="48" class="t" font-weight="800" font-size="23">Saca el pasador</text>
      <text x="24" y="88" class="m">Mano derecha al anillo amarillo</text><text x="24" y="112" class="m">+ grip, o botón A / X</text>
    </g>
    <g transform="translate(424 696)">
      <rect width="368" height="128" rx="16" fill="#1c2127" stroke="#2e353d"/>
      <circle cx="40" cy="40" r="22" class="dot"/><text x="40" y="48" text-anchor="middle" font-weight="900" font-size="22" fill="#1b1a10">2</text>
      <text x="76" y="48" class="t" font-weight="800" font-size="23">Apunta a la base</text>
      <text x="24" y="88" class="m">Lleva la retícula al círculo</text><text x="24" y="112" class="m">amarillo «BASE»</text>
    </g>
    <g transform="translate(808 696)">
      <rect width="368" height="128" rx="16" fill="#1c2127" stroke="#2e353d"/>
      <circle cx="40" cy="40" r="22" class="dot"/><text x="40" y="48" text-anchor="middle" font-weight="900" font-size="22" fill="#1b1a10">3</text>
      <text x="76" y="48" class="t" font-weight="800" font-size="23">Aprieta la palanca</text>
      <text x="24" y="88" class="m">Mantén el gatillo. Ojo con la</text><text x="24" y="112" class="m">carga: dura solo 8–12 s</text>
    </g>
    <g transform="translate(1192 696)">
      <rect width="368" height="128" rx="16" fill="#1c2127" stroke="#2e353d"/>
      <circle cx="40" cy="40" r="22" class="dot"/><text x="40" y="48" text-anchor="middle" font-weight="900" font-size="22" fill="#1b1a10">4</text>
      <text x="76" y="48" class="t" font-weight="800" font-size="23">Barre de lado a lado</text>
      <text x="24" y="88" class="m">Mueve la mano derecha</text><text x="24" y="112" class="m">a 2–3 m del fuego</text>
    </g>
  </g>

  <!-- ===== RETÍCULA Y CONSEJOS ===== -->
  <g transform="translate(40 846)">
    <rect width="760" height="124" rx="16" fill="#1c2127" stroke="#2e353d"/>
    <text x="24" y="38" class="t" font-size="22" font-weight="800">Color de la retícula</text>
    <circle cx="44" cy="82" r="16" fill="none" stroke="#4cc582" stroke-width="5"/><text x="70" y="89" class="m" font-size="20">en la base</text>
    <circle cx="244" cy="82" r="16" fill="none" stroke="#ffa21f" stroke-width="5"/><text x="270" y="89" class="m" font-size="20">muy alto / bajo</text>
    <circle cx="474" cy="82" r="16" fill="none" stroke="#ffffff" stroke-width="5"/><text x="500" y="89" class="m" font-size="20">fuera del fuego</text>
  </g>
  <g transform="translate(820 846)">
    <rect width="740" height="124" rx="16" fill="#1c2127" stroke="#2e353d"/>
    <text x="24" y="38" class="t" font-size="22" font-weight="800">Nivel 5 · bodega con humo</text>
    <text x="24" y="72" class="m" font-size="20">Si el humo baja, evacúa: camina hasta la puerta verde</text>
    <text x="24" y="100" class="m" font-size="20">de la derecha. En un incendio real, primero alarma y evacuar.</text>
  </g>
</svg>
</body></html>
